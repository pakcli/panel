<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8c9ad">
  <title>Character Filmstrip</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      --accent-color: #8b5cf6;
      --accent-rgb: 139, 92, 246;
      --bg-primary: #1e1e2e;
      --bg-secondary: #252538;
      --text-normal: #dcddde;
      --text-muted: #888888;
      --border-color: rgba(128, 128, 128, 0.2);
      background: var(--bg-primary);
      color: var(--text-normal);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg-primary);
    }

    body {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .stage {
      --pointer-x: 50%;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 440px;
      overflow: hidden;
      isolation: isolate;
      perspective: 1450px;
      cursor: ew-resize;
      touch-action: none;
      background:
        linear-gradient(90deg, rgba(var(--accent-rgb), 0.04) 1px, transparent 1px) 50% 0 / 25% 100%,
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 109px,
          rgba(var(--accent-rgb), 0.04) 110px,
          transparent 111px
        ),
        var(--bg-primary);
    }

    .stage::before,
    .stage::after {
      display: none;
    }

    .deck {
      position: absolute;
      inset: 0;
      z-index: 2;
      transform-style: preserve-3d;
    }

    .card {
      --focus: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(154px, 16.8vw, 238px);
      aspect-ratio: 0.72;
      padding: 7px;
      overflow: hidden;
      border: 2px solid rgba(var(--accent-rgb), calc(0.25 + var(--focus) * 0.75));
      border-radius: 8px;
      color: var(--text-normal);
      background: var(--bg-secondary);
      box-shadow:
        0 calc(10px + var(--focus) * 20px) calc(20px + var(--focus) * 30px)
          rgba(0, 0, 0, calc(0.4 + var(--focus) * 0.25)),
        0 0 calc(var(--focus) * 16px) rgba(var(--accent-rgb), calc(var(--focus) * 0.35));
      appearance: none;
      outline: none;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      cursor: pointer;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 5px;
      z-index: 3;
      border: 1px solid rgba(var(--accent-rgb), calc(0.12 + var(--focus) * 0.38));
      border-radius: 6px;
      pointer-events: none;
    }

    .card:focus-visible {
      box-shadow:
        0 24px 48px rgba(0, 0, 0, 0.55),
        0 0 0 3px var(--accent-color);
    }

    .card:hover {
      box-shadow:
        0 20px 44px rgba(0, 0, 0, 0.5),
        0 0 0 2px var(--accent-color);
      filter: brightness(1.06) !important;
      cursor: pointer;
    }

    .card * {
      pointer-events: none;
    }

    .portrait {
      position: absolute;
      inset: 7px 7px 25%;
      overflow: hidden;
      background: #766a58;
    }

    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(calc(1.04 + (1 - var(--focus)) * 0.06));
      filter:
        sepia(calc((1 - var(--focus)) * 0.24))
        saturate(calc(0.66 + var(--focus) * 0.34))
        contrast(1.04);
    }

    .footer {
      position: absolute;
      right: 7px;
      bottom: 7px;
      left: 7px;
      height: calc(25% - 7px);
      display: grid;
      grid-template-columns: clamp(26px, 3.2vw, 43px) 1fr;
      align-items: center;
      gap: clamp(6px, 0.7vw, 11px);
      padding: clamp(7px, 0.8vw, 12px);
      color: var(--text-normal);
      background: color-mix(in srgb, var(--bg-secondary) 88%, var(--bg-primary));
      border-top: 1px solid var(--border-color, rgba(var(--accent-rgb), 0.2));
      border-radius: 0 0 6px 6px;
      text-align: left;
    }

    .index {
      display: grid;
      width: clamp(23px, 2.7vw, 37px);
      aspect-ratio: 1;
      place-items: center;
      border: 1.5px solid var(--accent-color);
      border-radius: 50%;
      color: var(--accent-color);
      background: rgba(var(--accent-rgb), 0.1);
      font: 600 clamp(7px, 0.68vw, 11px)/1 ui-monospace, "SFMono-Regular", monospace;
    }

    .meta {
      min-width: 0;
    }

    .name,
    .role {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .name {
      color: var(--text-normal);
      font-size: clamp(8px, 0.86vw, 13px);
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.1;
    }

    .role {
      margin-top: clamp(3px, 0.35vw, 5px);
      color: var(--accent-color);
      font-size: clamp(5px, 0.48vw, 7px);
      font-weight: 700;
      letter-spacing: 0.15em;
      line-height: 1;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 650px) {
      .stage {
        min-height: 560px;
        cursor: ns-resize;
        background:
          linear-gradient(90deg, rgba(80, 58, 31, 0.08) 1px, transparent 1px) 50% 0 / 50% 100%,
          repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 87px,
            rgba(72, 52, 30, 0.13) 88px,
            transparent 89px
          ),
          radial-gradient(circle at 50% 50%, rgba(255, 246, 220, 0.78), transparent 35%),
          #d8c9ad;
      }

      .card {
        width: clamp(142px, 47vw, 180px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        will-change: auto;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Interactive editorial character filmstrip">
    <h1 class="sr-only">Character Filmstrip</h1>
    <p class="sr-only">Move, scroll, or use the arrow keys to browse the portraits.</p>
    <div class="deck" id="deck" data-testid="filmstrip"></div>
  </main>

  <script>
    (() => {
      const portraits = {
        sophie: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%236366f1'/><circle cx='50' cy='40' r='20' fill='%23e0e7ff'/><ellipse cx='50' cy='85' rx='32' ry='22' fill='%23e0e7ff'/></svg>",
        marcus: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23059669'/><circle cx='50' cy='40' r='20' fill='%23d1fae5'/><ellipse cx='50' cy='85' rx='32' ry='22' fill='%23d1fae5'/></svg>",
        julian: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23d97706'/><circle cx='50' cy='40' r='20' fill='%23fef3c7'/><ellipse cx='50' cy='85' rx='32' ry='22' fill='%23fef3c7'/></svg>",
        elena: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ec4899'/><circle cx='50' cy='40' r='20' fill='%23fce7f3'/><ellipse cx='50' cy='85' rx='32' ry='22' fill='%23fce7f3'/></svg>"
      };

      const profiles = [
        ["Sophie Lee", "Experience Designer", "sophie"],
        ["Marcus Thorne", "CGI Artist", "marcus"],
        ["Julian Hong", "Lead Web Engineer", "julian"],
        ["Elena Rossi", "Brand Strategist", "elena"],
        ["Sophie Lee", "Experience Designer", "sophie"],
        ["Marcus Thorne", "CGI Artist", "marcus"],
        ["Julian Hong", "Lead Web Engineer", "julian"],
        ["Elena Rossi", "Brand Strategist", "elena"],
        ["Marcus Thorne", "CGI Artist", "marcus"]
      ].map(([name, role, portrait]) => ({ name, role, portrait }));

      const stage = document.querySelector("#stage");
      const deck = document.querySelector("#deck");
      let cards = [];
      let count = 0;

      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const state = {
        phase: 0,
        target: 0,
        base: 0,
        pointerX: 0,
        pointerY: 0,
        active: false,
        lastInput: performance.now()
      };

      function buildCards(itemsToUse) {
        if (cards.length === itemsToUse.length && cards.length > 0) {
          itemsToUse.forEach((profile, index) => {
            const card = cards[index];
            if (!card) return;
            const imgSrc = profile.src || (portraits[profile.portrait] || "");
            const img = card.querySelector("img");
            if (img && img.src !== imgSrc) img.src = imgSrc;
            const nameEl = card.querySelector(".name");
            if (nameEl && nameEl.textContent !== profile.name) nameEl.textContent = profile.name;
            const roleEl = card.querySelector(".role");
            if (roleEl && roleEl.textContent !== (profile.role || "")) roleEl.textContent = profile.role || "";
          });
          return;
        }
        deck.innerHTML = "";
        cards = itemsToUse.map((profile, index) => {
          const card = document.createElement("button");
          card.className = "card";
          card.type = "button";
          card.tabIndex = -1;
          card.dataset.index = String(index);
          card.setAttribute("aria-label", `Focus ${profile.name}, ${profile.role || ""}`);
          const imgSrc = profile.src || (portraits[profile.portrait] || "");
          const roleText = profile.role || "";
          card.innerHTML = `
            <span class="portrait">
              <img src="${imgSrc}" alt="${profile.name}">
            </span>
            <span class="footer">
              <span class="index">${String(index + 1).padStart(2, "0")}</span>
              <span class="meta">
                <span class="name">${profile.name}</span>
                <span class="role">${roleText}</span>
              </span>
            </span>`;
          deck.append(card);
          // Click/pointerdown handled at stage level (see stage click handler below)
          // to avoid CSS 3D hit-testing issues where the center card's projected
          // bounding box intercepts clicks intended for side cards.
          card.addEventListener("dblclick", (e) => {
            e.stopPropagation();
            const imgEl = card.querySelector("img");
            const src = imgEl ? imgEl.src : (profile.src || "");
            window.parent.postMessage({ type: "character-carousel-card-dblclick", index, src, name: profile.name }, "*");
          });
          return card;
        });
        count = cards.length;
      }

      const autoPlayState = {
        currentCard: 0,
        fromCard: 0,
        toCard: 0,
        stepDelta: 1,
        startBase: 0,
        phase: 'hold',
        elapsed: 0,
        pingPongDir: 1,
      };

      function easeInOutExpo(x) {
        if (x <= 0) return 0;
        if (x >= 1) return 1;
        return x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
      }

      function wrappedDelta(index, phase) {
        if (!count) return 0;
        let delta = (index - phase) % count;
        while (delta > count / 2) delta -= count;
        while (delta < -count / 2) delta += count;
        return Number.isFinite(delta) ? delta : 0;
      }

      function nearestIndex() {
        if (!count) return 0;
        const raw = (Math.round(state.phase) % count + count) % count;
        return Number.isFinite(raw) ? raw : 0;
      }

      function moveTo(index) {
        if (!count) return;
        const currentBase = Math.round(state.phase);
        const currentMod = (currentBase % count + count) % count;
        let delta = (index - currentMod) % count;
        while (delta > count / 2) delta -= count;
        while (delta < -count / 2) delta += count;
        state.base = currentBase + delta;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();

        autoPlayState.currentCard = index;
        autoPlayState.fromCard = index;
        autoPlayState.toCard = index;
        autoPlayState.phase = 'hold';
        autoPlayState.elapsed = 0;
        if (index >= count - 1) {
          autoPlayState.pingPongDir = -1;
        } else if (index <= 0) {
          autoPlayState.pingPongDir = 1;
        }
      }

      const initialItems = window.__CHARACTER_CAROUSEL_ITEMS;
      if (Array.isArray(initialItems) && initialItems.length > 0) {
        buildCards(initialItems);
      } else {
        buildCards(profiles);
      }

      window.addEventListener("message", (event) => {
        if (!event.data) return;
        if (event.data.type === "character-carousel-items" && Array.isArray(event.data.items) && event.data.items.length > 0) {
          const prevCount = count;
          buildCards(event.data.items);
          if (prevCount === 0) {
            state.phase = 0;
            state.target = 0;
            state.base = 0;
            autoPlayState.currentCard = 0;
            autoPlayState.phase = 'hold';
            autoPlayState.elapsed = 0;
          }
        }
        if (event.data.type === "character-carousel-focus" && typeof event.data.index === "number") {
          const targetIdx = (event.data.index % count + count) % count;
          if (nearestIndex() !== targetIdx || Math.abs(state.target - state.phase) > 0.05) {
            moveTo(targetIdx);
          }
        }
      });

      stage.addEventListener("pointermove", (event) => {
        const rect = stage.getBoundingClientRect();
        const nx = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width - 0.5) * 2));
        const ny = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height - 0.5) * 2));
        const cursorFollow = window.__CHARACTER_CAROUSEL_CONTROLS && window.__CHARACTER_CAROUSEL_CONTROLS.cursorFollow;
        if (cursorFollow) {
          state.pointerX = nx;
          state.pointerY = ny;
          state.active = true;
          state.target = state.base + (innerWidth < 650 ? ny * 2.2 : nx * 3.1);
          state.lastInput = performance.now();
          stage.style.setProperty("--pointer-x", `${(nx + 1) * 50}%`);
        }
      });

      stage.addEventListener("pointerleave", () => {
        state.active = false;
        state.pointerX = 0;
        state.pointerY = 0;
        state.target = state.base;
        stage.style.setProperty("--pointer-x", "50%");
      });

      stage.addEventListener("wheel", (event) => {
        event.preventDefault();
        const direction = Math.sign(Math.abs(event.deltaY) > Math.abs(event.deltaX) ? event.deltaY : event.deltaX);
        if (!direction) return;
        state.base += direction;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
        autoPlayState.phase = 'hold';
        autoPlayState.elapsed = 0;
        autoPlayState.currentCard = nearestIndex();
      }, { passive: false });

      // Stage-level click handler — finds the card whose 2D projected center-X
      // is closest to the click. This is more reliable than CSS 3D hit-testing,
      // which causes the center card's large projected bounding box to intercept
      // clicks that visually appear over side cards.
      let lastStageClickTime = 0;
      stage.addEventListener("click", (e) => {
        const now = performance.now();
        if (now - lastStageClickTime < 250) return;
        if (!cards || !cards.length) return;
        lastStageClickTime = now;

        const stageRect = stage.getBoundingClientRect();
        const clickX = e.clientX - stageRect.left;
        const clickY = e.clientY - stageRect.top;

        // Skip if click is far outside the stage bounds
        if (clickX < 0 || clickX > stageRect.width || clickY < 0 || clickY > stageRect.height) return;

        let bestCard = null;
        let bestDist = Infinity;
        for (const c of cards) {
          if (!c || c.style.pointerEvents === 'none') continue;
          const cr = c.getBoundingClientRect();
          if (cr.width === 0 || cr.height === 0) continue;
          const centerX = (cr.left + cr.right) / 2 - stageRect.left;
          const dist = Math.abs(clickX - centerX);
          if (dist < bestDist) {
            bestDist = dist;
            bestCard = c;
          }
        }

        if (!bestCard) return;
        const idx = parseInt(bestCard.dataset.index, 10);
        if (!Number.isFinite(idx)) return;
        moveTo(idx);
        window.parent.postMessage({ type: "character-carousel-card-click", index: idx }, "*");
      });

      addEventListener("keydown", (event) => {
        const forward = event.key === "ArrowRight" || event.key === "ArrowDown";
        const backward = event.key === "ArrowLeft" || event.key === "ArrowUp";
        if (!forward && !backward) return;
        event.preventDefault();
        state.base += forward ? 1 : -1;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
        autoPlayState.phase = 'hold';
        autoPlayState.elapsed = 0;
        autoPlayState.currentCard = nearestIndex();
      });

      let previousTime = performance.now();
      let prevAutoPlay = null;
      let lastReportedActiveIndex = -1;

      function render(time) {
        const deltaTime = Math.min(32, Math.max(0, time - previousTime));
        previousTime = time;
        const ease = reducedMotion ? 1 : 1 - Math.pow(0.001, deltaTime / 1000);

        const ctrl = window.__CHARACTER_CAROUSEL_CONTROLS || {};
        const autoPlayEnabled = ctrl.autoPlay !== false && !ctrl.paused;

        if (prevAutoPlay !== null && prevAutoPlay !== autoPlayEnabled) {
          autoPlayState.phase = 'hold';
          autoPlayState.elapsed = 0;
          if (!autoPlayEnabled) {
            // Pausing: keep destination target intact so clicked card finishes smoothly centering
            state.target = Math.round(state.target);
            state.base = state.target;
            const destIdx = (state.target % count + count) % count;
            autoPlayState.currentCard = destIdx;
            autoPlayState.fromCard = destIdx;
            autoPlayState.toCard = destIdx;
          } else {
            // Resuming playback: continue smoothly from current center card
            const activeIdx = nearestIndex();
            autoPlayState.currentCard = activeIdx;
            autoPlayState.fromCard = activeIdx;
            autoPlayState.toCard = activeIdx;
            state.base = Math.round(state.phase);
            state.target = state.base;
          }
        }
        prevAutoPlay = autoPlayEnabled;

        const animSpeed = Math.max(0.1, ctrl.speed || 1.0);
        const holdDurationMs = Math.max(0, (ctrl.holdDuration ?? 1.0) * 1000);
        const switchDurationMs = Math.max(10, (ctrl.switchDuration ?? 0.5) * 1000);
        const curveType = String(ctrl.curve || 'exponential').toLowerCase();
        const dir = String(ctrl.direction || 'left-right').toLowerCase().replace(/\s+/g, '-');

        if (autoPlayEnabled && !state.active && holdDurationMs === 0 && curveType === 'linear' && count > 1) {
          // Continuous marquee glide
          const glideSpeed = (1 / switchDurationMs) * (deltaTime * animSpeed);
          let moveDir = 1;
          if (dir === 'right') {
            moveDir = -1;
          } else if (dir === 'left') {
            moveDir = 1;
          } else {
            if (state.phase >= count - 1) autoPlayState.pingPongDir = -1;
            else if (state.phase <= 0) autoPlayState.pingPongDir = 1;
            moveDir = autoPlayState.pingPongDir;
          }
          state.base += moveDir * glideSpeed;
          state.target = state.base;
          state.phase = state.base;
          autoPlayState.currentCard = nearestIndex();
        } else if (autoPlayEnabled && !state.active && count > 1) {
          // Discrete card-by-card stepping
          autoPlayState.elapsed += deltaTime * animSpeed;

          if (autoPlayState.phase === 'hold') {
            state.target = state.base;
            state.phase += (state.target - state.phase) * ease;

            if (autoPlayState.elapsed >= holdDurationMs) {
              autoPlayState.phase = 'switch';
              autoPlayState.elapsed = 0;
              autoPlayState.fromCard = nearestIndex();

              let nextIndex;
              if (dir === 'left') {
                nextIndex = (autoPlayState.fromCard + 1) % count;
              } else if (dir === 'right') {
                nextIndex = (autoPlayState.fromCard - 1 + count) % count;
              } else {
                let candidate = autoPlayState.fromCard + autoPlayState.pingPongDir;
                if (candidate >= count) {
                  autoPlayState.pingPongDir = -1;
                  candidate = Math.max(0, count - 2);
                } else if (candidate < 0) {
                  autoPlayState.pingPongDir = 1;
                  candidate = Math.min(count - 1, 1);
                }
                nextIndex = candidate;
              }
              autoPlayState.toCard = nextIndex;

              let stepDelta = (autoPlayState.toCard - autoPlayState.fromCard) % count;
              while (stepDelta > count / 2) stepDelta -= count;
              while (stepDelta < -count / 2) stepDelta += count;
              autoPlayState.stepDelta = stepDelta;
              autoPlayState.startBase = state.base;
            }
          } else if (autoPlayState.phase === 'switch') {
            const progress = Math.min(1, Math.max(0, autoPlayState.elapsed / switchDurationMs));
            let easedT = progress;
            if (curveType === 'exponential' || curveType.includes('expo')) {
              easedT = easeInOutExpo(progress);
            }

            const stepDelta = autoPlayState.stepDelta ?? 1;
            state.base = autoPlayState.startBase + stepDelta * easedT;
            state.target = state.base;
            state.phase = state.base;

            if (progress >= 1) {
              autoPlayState.phase = 'hold';
              autoPlayState.elapsed = 0;
              autoPlayState.currentCard = autoPlayState.toCard;
              state.base = Math.round(state.base);
              state.target = state.base;
              state.phase = state.base;
            }
          }
        } else {
          // Manual navigation or paused
          state.phase += (state.target - state.phase) * ease;
          if (Math.abs(state.target - state.phase) < 0.001) {
            state.phase = state.target;
          }
        }

        const compact = innerWidth < 650;
        const isVerticalControls = (window.__CHARACTER_CAROUSEL_CONTROLS && window.__CHARACTER_CAROUSEL_CONTROLS.orientation === 'vertical');
        const activeIndex = nearestIndex();
        if (lastReportedActiveIndex !== activeIndex && Math.abs(state.target - state.phase) < 0.15) {
          lastReportedActiveIndex = activeIndex;
          window.parent.postMessage({ type: "character-carousel-active-index", index: activeIndex }, "*");
        }
        const horizontalSpacing = Math.min(230, Math.max(145, innerWidth * 0.155));
        const verticalSpacing = Math.min(130, Math.max(90, innerHeight * 0.12));

        cards.forEach((card, index) => {
          const delta = wrappedDelta(index, state.phase);
          const distance = Math.abs(delta);

          const maxSide = (window.__CHARACTER_CAROUSEL_CONTROLS && typeof window.__CHARACTER_CAROUSEL_CONTROLS.sideCards === 'number')
            ? window.__CHARACTER_CAROUSEL_CONTROLS.sideCards
            : 5;

          if (maxSide === 0) {
            if (distance > 0.35) {
              card.style.opacity = "0";
              card.style.pointerEvents = "none";
              card.style.transform = "scale(0)";
              return;
            }
          } else if (distance > maxSide + 0.5) {
            card.style.opacity = "0";
            card.style.pointerEvents = "none";
            card.style.transform = "scale(0)";
            return;
          }

          card.style.pointerEvents = "auto";
          const sideDenominator = Math.max(1, maxSide + 1);
          const focus = Math.exp(-distance * distance * 1.28);
          const side = Math.max(0, 1 - distance / sideDenominator);
          const direction = Math.sign(delta);

          let x, y, rotateX, rotateY, rotateZ;

          if (isVerticalControls) {
            x = state.pointerX * focus * 6;
            y = delta * verticalSpacing;
            rotateX = -state.pointerY * focus * 3.5;
            rotateY = state.pointerX * focus * 3;
            rotateZ = 0;
          } else if (compact) {
            x = delta * 24 + Math.sin(delta * 0.9) * 25;
            y = delta * verticalSpacing;
            rotateX = delta * 2.1;
            rotateY = -delta * 5;
            rotateZ = delta * -1.4;
          } else {
            x = delta * horizontalSpacing;
            y = distance * 8 + state.pointerY * focus * 10;
            rotateX = -state.pointerY * focus * 3.5;
            rotateY = -direction * (distance > 0.2 ? 14 + Math.min(distance, 3) * 5 : 0) + state.pointerX * focus * 3;
            rotateZ = delta * 0.7;
          }

          const z = focus * 100 - distance * 90;
          const scale = 0.54 + side * 0.15 + focus * 0.54;

          card.style.setProperty("--focus", focus.toFixed(4));
          card.style.zIndex = String(Math.round(1000 - distance * 100));
          card.style.opacity = String(Math.max(0.13, side * 0.76 + focus * 0.24));
          const blurPx = Math.max(0, distance - 1.5) * 0.38;
          card.style.filter = blurPx > 0.01 ? `blur(${blurPx.toFixed(2)}px)` : '';
          card.style.transform = [
            "translate(-50%, -50%)",
            `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, ${z.toFixed(2)}px)`,
            `rotateX(${rotateX.toFixed(2)}deg)`,
            `rotateY(${rotateY.toFixed(2)}deg)`,
            `rotateZ(${rotateZ.toFixed(2)}deg)`,
            `scale(${scale.toFixed(4)})`
          ].join(" ");
          card.setAttribute("aria-current", index === activeIndex ? "true" : "false");
        });

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
